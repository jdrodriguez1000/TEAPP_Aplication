<!doctype html>
<!--
  La pantalla de TEAPP.

  Este archivo se edita a mano. El `app.js` que carga al final NO: ese lo escribe
  el compilador a partir de `frontend/app.ts`.

  Los textos que ve quien usa la app van en ingles (PI-5): es una app para
  practicar ingles. Los comentarios, en espanol.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TEAPP — Practice English</title>
    <style>
      /* Cuatro reglas y ya. Un archivo .css aparte no se gana el sitio todavia. */
      body {
        font-family: system-ui, sans-serif;
        max-width: 34rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      input,
      button {
        font: inherit;
        padding: 0.5rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
      }
      #verdict {
        font-weight: bold;
        min-height: 1.5rem;
      }
      #error {
        color: #b00020;
        min-height: 1.5rem;
      }
      .counters {
        color: #555;
      }
      .hint {
        color: #555;
        font-size: 0.85rem;
        margin: 0.25rem 0 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Practice English</h1>

    <!-- 🔑 El paso 5 en la pantalla: aqui habia una casilla "Your name" que el
         navegador recordaba, y el servidor se creia. Ya no existe. Ahora hay
         que probar quien eres, y a cambio el servidor entrega una cookie
         firmada por el. Ver [D-013] y [D-021].

         Las dos secciones se turnan: quien no ha entrado ve la de arriba, y
         quien ya entro ve la de abajo. -->
    <section id="signed-out" hidden>
      <p>Sign in to practice. Your score is kept under your name.</p>

      <form id="signin-form">
        <label for="user">Your name</label>
        <input id="user" name="user" autocomplete="username" />
        <p class="hint">Lowercase letters, numbers, hyphen and underscore only.</p>

        <label for="password">Your password</label>
        <!-- `type="password"` para que no se lea por encima del hombro, y
             `autocomplete` para que el gestor de contrasenas del navegador
             sepa que es esto y ofrezca guardarla. -->
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <p class="hint">At least 8 characters.</p>

        <p>
          <button id="login" type="submit">Log in</button>
          <button id="register" type="button">Create account</button>
        </p>
      </form>
    </section>

    <section id="signed-in" hidden>
      <p>
        Signed in as <strong id="whoami"></strong>.
        <button id="logout" type="button">Log out</button>
      </p>

      <form id="practice-form">
        <label for="sentence">Your sentence</label>
        <input id="sentence" name="sentence" autocomplete="off" />
        <p><button id="send" type="submit">Send</button></p>
      </form>
    </section>

    <!-- Las tres piezas de [D-008], cada una en su sitio. Empiezan vacias. -->
    <p id="error"></p>
    <p id="verdict"></p>
    <p class="counters">Words: <span id="words">—</span> · Score: <span id="score">—</span></p>

    <!-- `defer` espera a que el HTML este completo. Sin el, el script correria
         antes de que existieran los elementos y no encontraria ninguno. -->
    <script src="/static/app.js" defer></script>
  </body>
</html>
